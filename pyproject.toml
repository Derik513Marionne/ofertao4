[project]
name = "ofertao"
version = "0.1.0"
description = "Ofertão - comparador automático de supermercados em todo o Brasil"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "anthropic>=0.40.0",
    "python-multipart>=0.0.9",
    "pymupdf>=2.1",
]

[tool.setuptools]
packages = ["app", "app.coletores"]

[tool.vercel]
entrypoint = "main:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
